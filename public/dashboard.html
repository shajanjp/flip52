<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Flip 52</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeUp 0.4s ease both; }
        .room-row { animation: fadeUp 0.3s ease both; }
    </style>
</head>
<body class="bg-gray-50 dark:bg-gray-950 text-gray-900 dark:text-gray-100 min-h-screen antialiased transition-colors duration-300">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-6 sm:py-10">
        <!-- Header -->
        <header class="flex items-center justify-between mb-8">
            <div>
                <div class="flex items-center gap-3 mb-1">
                    <span class="text-2xl font-black text-blue-600">♠52</span>
                    <h1 class="text-xl sm:text-2xl font-black text-gray-800 dark:text-white">Dashboard</h1>
                </div>
                <p id="last-updated" class="text-[11px] text-gray-400 dark:text-gray-500 font-semibold uppercase tracking-widest">Connecting...</p>
            </div>
            <a href="/" class="inline-flex items-center gap-1.5 text-sm font-semibold text-blue-500 hover:text-blue-600 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="m12 19-7-7 7-7"/></svg>
                Back to Game
            </a>
        </header>

        <!-- Room Cards -->
        <div id="rooms-container" class="space-y-3">
            <!-- Rooms rendered here -->
            <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-8 text-center">
                <div class="inline-flex items-center justify-center w-10 h-10 rounded-xl bg-gray-100 dark:bg-gray-800 mb-3">
                    <svg class="w-5 h-5 text-gray-400 animate-spin" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/></svg>
                </div>
                <p class="text-sm text-gray-500 dark:text-gray-400 font-medium">Loading rooms...</p>
            </div>
        </div>
    </div>

    <script>
        async function fetchRooms() {
            try {
                const response = await fetch('/api/rooms');
                const data = await response.json();
                
                let rooms = [];
                let timestamp = Date.now();

                if (Array.isArray(data)) {
                    rooms = data;
                } else if (data && Array.isArray(data.rooms)) {
                    rooms = data.rooms;
                    timestamp = data.timestamp || timestamp;
                } else {
                    console.error('Unexpected response format:', data);
                    return;
                }

                const container = document.getElementById('rooms-container');
                document.getElementById('last-updated').innerText = `Last Updated: ${new Date(timestamp).toLocaleTimeString()}`;
                
                if (rooms.length === 0) {
                    container.innerHTML = `
                        <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-8 text-center animate-in">
                            <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-gray-100 dark:bg-gray-800 mb-4">
                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-gray-400"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg>
                            </div>
                            <h3 class="text-base font-bold text-gray-800 dark:text-white mb-1">No Active Rooms</h3>
                            <p class="text-sm text-gray-400 dark:text-gray-500">Create or join a room from the game to get started.</p>
                        </div>
                    `;
                    return;
                }

                container.innerHTML = rooms.map((room, i) => {
                    const playersHtml = room.players.map(p => `
                        <div class="inline-flex items-center gap-1.5 px-2.5 py-1 rounded-full border text-xs font-semibold whitespace-nowrap shadow-sm bg-white dark:bg-gray-800 text-gray-600 dark:text-gray-300 border-gray-200 dark:border-gray-700">
                            <span class="relative flex h-1.5 w-1.5">
                                ${p.online ? '<span class="animate-ping absolute h-full w-full rounded-full bg-green-400 opacity-75"></span><span class="relative rounded-full h-1.5 w-1.5 bg-green-400"></span>' : '<span class="rounded-full h-1.5 w-1.5 bg-gray-300 dark:bg-gray-600"></span>'}
                            </span>
                            <span class="max-w-[64px] truncate">${p.name}</span>
                        </div>
                    `).join('');

                    const stateColor = room.state === 'WAITING' ? 'text-emerald-600 dark:text-emerald-400' : 'text-amber-600 dark:text-amber-400';
                    const stateBg = room.state === 'WAITING' ? 'bg-emerald-50 dark:bg-emerald-900/20' : 'bg-amber-50 dark:bg-amber-900/20';

                    return `
                        <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-gray-100 dark:border-gray-800 p-4 sm:p-5 hover:shadow-md hover:border-gray-200 dark:hover:border-gray-700 transition-all room-row" style="animation-delay:${i * 50}ms">
                            <div class="flex flex-col sm:flex-row sm:items-center gap-3 sm:gap-4">
                                <div class="flex items-center gap-3 sm:min-w-0 shrink-0">
                                    <span class="font-mono font-bold text-blue-600 dark:text-blue-400 text-sm sm:text-base">${room.roomId}</span>
                                    <span class="px-2 py-0.5 rounded-full text-[10px] font-bold uppercase tracking-wider ${stateBg} ${stateColor}">${room.state}</span>
                                </div>
                                <div class="hidden sm:block text-xs text-gray-400 dark:text-gray-500 font-medium shrink-0">
                                    ${room.hostName}
                                </div>
                                <div class="flex flex-wrap gap-1.5 flex-1 min-w-0">
                                    ${playersHtml}
                                </div>
                                <div class="sm:hidden text-xs text-gray-400 dark:text-gray-500 font-medium">
                                    Host: ${room.hostName}
                                </div>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                console.error('Error fetching rooms:', error);
                document.getElementById('rooms-container').innerHTML = `
                    <div class="bg-white dark:bg-gray-900 rounded-2xl shadow-sm border border-red-100 dark:border-red-900/30 p-8 text-center animate-in">
                        <div class="inline-flex items-center justify-center w-12 h-12 rounded-2xl bg-red-50 dark:bg-red-900/20 mb-4">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" class="text-red-400"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                        </div>
                        <h3 class="text-base font-bold text-gray-800 dark:text-white mb-1">Connection Error</h3>
                        <p class="text-sm text-gray-400 dark:text-gray-500">Failed to load rooms. Please try again later.</p>
                    </div>
                `;
            }
        }

        fetchRooms();
        setInterval(fetchRooms, 30000);

        if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
